name: Build and Test Docker App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t chat-sql-ai .

      - name: Run test container with embedded Python
        run: |
          echo "SELECT * FROM students;" | docker run --rm -i chat-sql-ai /bin/bash -c "export OPENAI_API_KEY='${OPENAI_API_KEY}'; python -c \"import sqlite3; import pandas as pd; conn = sqlite3.connect('students.db'); df = pd.read_sql_query(input(), conn); print(df.head())\""
